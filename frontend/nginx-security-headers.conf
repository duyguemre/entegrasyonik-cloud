# Entegrasyonik web uygulaması — güvenlik başlıkları (R7 / G-03, PLATFORM_BASELINE B5).
# `nginx.conf` içindeki HER `location` bloğundan `include` edilir (nginx'te bir `location` kendi
# `add_header`'ını tanımlarsa üst seviyedekiler MİRAS ALINMAZ — bu yüzden tek dosya, her yerde include).
#
# ZORUNLU (enforce) başlıklar — uygulamayı kırmaz:
add_header X-Content-Type-Options    "nosniff" always;
add_header X-Frame-Options           "DENY" always;
add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

# CSP: ÖNCE Report-Only (ADR-0017 §10). Zorunlu hale getirme kapısı: 2 hafta boyunca ihlal raporu 0
# (`/client-log` `kind:'csp'` ADR-0017 Aşama D'de gelir; o zamana dek tarayıcı konsolu/DevTools'tan izlenir).
#  - script-src 'self': satır içi betik YOK (SW kaydı `src/registerServiceWorker.ts` modülüne taşındı, T-18);
#    `unsafe-eval` bilerek YOK — ihlal çıkarsa (ör. bir bağımlılık `new Function` kullanıyorsa) rapordan görülür.
#  - style-src 'unsafe-inline': Vuetify/ECharts çalışma zamanında satır içi stil yazıyor (ölçülünce daraltılır).
#  - img-src https:: pazaryeri ürün görselleri ve kiracı logo adresleri çok sayıda farklı https kaynağından gelir.
#  - connect-src: API kökeni ortama göre eklenmeli (VITE_API_BASE_URL). Aşağıdaki liste üretim alan adı
#    ailesini kapsar; farklı bir API alan adı kullanılıyorsa buraya EKLENİR (Report-Only olduğu için kırmaz).
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://*.entegrasyonik.com; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

# HSTS bilerek burada AÇIK DEĞİL: TLS'i Railway/Render gibi bir ön proxy sonlandırıyorsa başlığı orası
# eklemelidir; nginx'in kendisi TLS sonlandırıyorsa şu satır etkinleştirilir (alt alan adları kararı insan onayı):
