<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Bağlantı yok · Entegrasyonik</title>
  <!-- MOB-01 — dürüst çevrimdışı ekranı. Service worker yalnız bu sayfayı ve kabuk dosyalarını önbellekte tutar;
       kiracı verisi önbellekte YOK, bu yüzden çevrimdışıyken hiçbir veri gösterilmez. Satır içi betik yok (CSP).
       Renkler İSTİSNAEN literal (ayrı belge; paket token'larına erişemez): packages/ui/src/tokens/palette.ts ile senkron. -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <meta name="theme-color" content="#13255B" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0B1530" media="(prefers-color-scheme: dark)">
  <script src="/theme-boot.js" data-storage-key="ek-theme"></script>
  <style>
    :root { --bg: #F6F8FB; --card: #FFFFFF; --border: #E4E8EF; --ink: #121A2B; --muted: #505C71; --brand: #2E55D4; --on-brand: #FFFFFF; }
    :root[data-theme="dark"] { --bg: #0E131E; --card: #151B28; --border: #222B3B; --ink: #EEF2F8; --muted: #A3AEC0; --brand: #6C8BE6; --on-brand: #0B0F18; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--ink);
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { width: 100%; max-width: 420px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 32px 24px; text-align: center; }
    img { width: 48px; height: 48px; }
    h1 { font-size: 1.25rem; font-weight: 600; margin: 16px 0 8px; }
    p { margin: 0 0 24px; color: var(--muted); line-height: 1.5; font-size: .9375rem; }
    a.retry { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; min-width: 44px; padding: 0 20px;
      border-radius: 8px; background: var(--brand); color: var(--on-brand); font-weight: 600; text-decoration: none; }
    a.retry:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
  </style>
</head>
<body>
  <main role="main" aria-labelledby="t">
    <img src="/favicon.svg" alt="" width="48" height="48">
    <h1 id="t">İnternet bağlantısı yok</h1>
    <p>Entegrasyonik çevrimdışıyken veri göstermez ve işlem yapmaz. Bağlantınız geri geldiğinde sayfa kendiliğinden yenilenir.</p>
    <a class="retry" href="/">Tekrar dene</a>
  </main>
  <script src="/offline.js"></script>
</body>
</html>
