<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bağlantı yok</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; background: Canvas; color: CanvasText; }
      main { max-width: 360px; text-align: center; }
      button { font: inherit; background: none; cursor: pointer; display: inline-block; margin-top: 16px; padding: 12px 20px; border: 1px solid currentColor; border-radius: 8px; color: inherit; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <h1>Bağlantı kurulamadı</h1>
      <p>İnternet bağlantınızı kontrol edip yeniden deneyin. Veriler cihazda saklanmaz; bağlantı gelince kaldığınız yerden devam edersiniz.</p>
      <button type="button" onclick="history.length > 1 ? history.back() : location.reload()">Yeniden dene</button>
    </main>
  </body>
</html>
