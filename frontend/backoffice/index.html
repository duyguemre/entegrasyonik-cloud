<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <!-- ADR-0026 Karar 4.1: arama motoru dışı, referrer yok (sunucu başlıkları da aynısını söyler). -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <title>Entegrasyonik Yönetim</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- MOB-06 — PWA (ayrı kimlik: "Entegrasyonik Yönetim", kendi origin'i ve kapsamı; uygulama PWA'sıyla çakışmaz).
         Tema rengi üst bar zemini: açık navy[900] / koyu inkDark.chromeStart. -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#13255B" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0B1530" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="EK Yönetim" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- ADR-0026 Karar 3.4: eşzamanlı tema önyüklemesi, CSS'ten ÖNCE (ilk kare doğru tema). -->
    <script src="/theme-boot.js" data-storage-key="ek-bo-theme"></script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
    <script type="module" src="/src/registerServiceWorker.ts"></script>
  </body>
</html>
