<!--
  frontend/src/design/brand/logo-mark.svg

  ADR-0015 Karar 1.4 — ürün işareti (mark) geometrisi. Bu geometri
  `site/src/components/Logo.astro`'daki ile BİREBİR AYNI olmak zorundadır
  (statik drift testi: tests/theme/logo-drift.test.ts). Nihai logo/renk
  uyumu insan kararıdır (Açık Soru 1); S15 (site) özgün işaret: "E" monogramı —
  iki kanal düğümü + gövdeden çıkan orta kolun buluştuğu teal merkez (halo ile).

  Bu dosya `EkBrandLogo.vue`'nün render ettiği inline SVG'nin KAYNAK
  geometrisidir (renk `currentColor`/CSS ile uygulanır, burada sabit
  değildir — drift testi yalnızca x/y/width/height/rx/cx/cy/r
  ölçülerini karşılaştırır).
-->
<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <rect class="logo__tile" x="0" y="0" width="32" height="32" rx="9"></rect>
  <circle class="logo__halo" cx="18.5" cy="16" r="5"></circle>
  <path class="logo__stroke" d="M20 9.5H13C10.8 9.5 9.5 10.8 9.5 13V19C9.5 21.2 10.8 22.5 13 22.5H20M9.5 16H15.5"></path>
  <circle class="logo__hub" cx="18.5" cy="16" r="3"></circle>
  <circle class="logo__node" cx="22" cy="9.5" r="2.25"></circle>
  <circle class="logo__node" cx="22" cy="22.5" r="2.25"></circle>
</svg>
