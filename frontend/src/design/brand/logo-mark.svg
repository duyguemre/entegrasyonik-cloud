<!--
  frontend/src/design/brand/logo-mark.svg

  ADR-0015 Karar 1.4 — ürün işareti (mark) geometrisi. Bu geometri
  `site/src/components/Logo.astro`'daki ile BİREBİR AYNI olmak zorundadır
  (statik drift testi: tests/theme/logo-drift.test.ts). Nihai logo/renk
  uyumu insan kararıdır (Açık Soru 1); bugün ikisi de aynı yer tutucu
  işareti (lacivert kare + teal merkez + 3 düğüm) kullanır.

  Bu dosya `EkBrandLogo.vue`'nün render ettiği inline SVG'nin KAYNAK
  geometrisidir (renk `currentColor`/CSS ile uygulanır, burada sabit
  değildir — drift testi yalnızca x/y/width/height/rx/cx/cy/r
  ölçülerini karşılaştırır).
-->
<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <rect class="logo__tile" x="0" y="0" width="32" height="32" rx="8"></rect>
  <circle class="logo__hub" cx="16" cy="16" r="5"></circle>
  <circle class="logo__node" cx="16" cy="6.5" r="2.5"></circle>
  <circle class="logo__node" cx="24.2" cy="20.8" r="2.5"></circle>
  <circle class="logo__node" cx="7.8" cy="20.8" r="2.5"></circle>
</svg>
